<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 210" width="1200" height="210" role="img" aria-label="Hi, I'm Bipul. Applied AI, Machine Learning, Computer Vision">
  <defs>
    <linearGradient id="posh" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#610722"/>
      <stop offset="1" stop-color="#7f0353"/>
    </linearGradient>
  </defs>
  <!-- back wave: lower, see-through, drifting right -->
  <path d="M-200,180 Q0,160 200,180 T600,180 T1000,180 T1400,180 T1800,180 T2200,180 T2600,180 L2400,0 L-200,0 Z" fill="url(#posh)" opacity="0.5">
    <animateTransform attributeName="transform" type="translate" from="-800 0" to="0 0" dur="14s" repeatCount="indefinite"/>
  </path>
  <!-- front wave: solid, drifting left -->
  <path d="M0,160 Q200,145 400,160 T800,160 T1200,160 T1600,160 T2000,160 T2400,160 L2400,0 L0,0 Z" fill="url(#posh)">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-800 0" dur="10s" repeatCount="indefinite"/>
  </path>
  <g fill="#ffffff" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="600" y="84" font-size="52" font-weight="700">Hi, I'm Bipul</text>
    <text x="600" y="122" font-size="19" font-weight="500" opacity="0.9">Applied AI • Machine Learning • Computer Vision</text>
  </g>
</svg>
